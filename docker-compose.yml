services:
  app:
    build: .
    container_name: cpt-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - DATABASE_URL=mysql://root:password@db:3306/competitor_analysis
      - AI_PROVIDER=${AI_PROVIDER:-zhipu}
      - AI_MODEL=${AI_MODEL:-claude-sonnet-4-20250514}
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - PROXY_LIST=${PROXY_LIST:-}
      - PORT=3001
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage-data:/app/storage

  db:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: cpt-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: competitor_analysis
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  storage-data:
