services:
  app:
    build: .
    container_name: cpt-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - DATABASE_URL=mysql://root:password@host.docker.internal:3306/competitor_analysis
      - AI_PROVIDER=${AI_PROVIDER:-zhipu}
      - AI_MODEL=${AI_MODEL:-claude-sonnet-4-20250514}
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - PROXY_LIST=${PROXY_LIST:-}
      - PORT=3001
      - NODE_ENV=production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage-data:/app/storage

volumes:
  storage-data:
